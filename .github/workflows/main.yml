name: puppet-bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: puppet-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests beautifulsoup4

      - name: Check connectivity
        continue-on-error: true
        run: |
          curl -4 -sv -m 15 https://puppet-minsk.by/afisha -o /dev/null
          curl -6 -sv -m 15 https://puppet-minsk.by/afisha -o /dev/null

      - name: Run bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python puppet_bot.py

      - name: Save state
        run: |
          git config user.name "puppet-bot"
          git config user.email "puppet-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state" && git push)
